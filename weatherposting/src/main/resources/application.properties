# ================================
# H2 DATABASE CONFIGURATION
# ================================

# Enable H2 console in browser (at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# In-memory DB URL ? disappears when app stops (perfect for testing)
spring.datasource.url=jdbc:h2:mem:weatherdb

# JDBC driver for H2
spring.datasource.driverClassName=org.h2.Driver

# Hibernate auto-create tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (optional but helpful)
spring.jpa.show-sql=true


# ================================
# EXTERNAL WEATHER API CONFIG
# ================================

# Your OpenWeatherMap API key
weather.api.key=df99e3e58c915a7514070f4d0fc825ed

# Base URL for calling current weather data
weather.api.base-url=https://api.openweathermap.org/data/2.5/weather


# ================================
# SERVER CONFIG (OPTIONAL)
# ================================

# Changes port from 8080 if you want, but 8080 is standard
# server.port=8080
